# docker compose run --rm test     -> run the tests
# docker compose run --rm lint     -> style and security lint
# docker compose up web            -> dashboard on http://localhost:8080 (copy docs/config.example.js to frontend/config.js first)
services:
  test:
    build: { context: ., dockerfile: docker/Dockerfile.dev }
    command: pytest -q
  lint:
    build: { context: ., dockerfile: docker/Dockerfile.dev }
    command: ruff check app scripts
  web:
    image: nginx:1.27-alpine
    ports: ["8080:80"]
    volumes: ["./frontend:/usr/share/nginx/html:ro"]

openapi: 3.0.3
info: { title: CloudGuard API, version: "1.0" }
security: [{ cognito: [] }]
components:
  securitySchemes:
    cognito: { type: http, scheme: bearer, bearerFormat: JWT, description: Cognito ID token }
paths:
  /me: { get: { summary: Current user and roles, responses: { "200": { description: OK } } } }
  /findings: { get: { summary: List findings (viewer), parameters: [{ name: severity, in: query, schema: { type: string } }, { name: status, in: query, schema: { type: string } }], responses: { "200": { description: OK } } } }
  /findings/{id}: { get: { summary: One finding (viewer), parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { "200": { description: OK }, "404": { description: Not found } } } }
  /findings/{id}/resolve: { post: { summary: Resolve a finding (admin), parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { "200": { description: OK }, "403": { description: Not admin } } } }
  /scans:
    get: { summary: Recent scans (viewer), responses: { "200": { description: OK } } }
    post: { summary: Queue a scan (admin), responses: { "202": { description: Queued }, "403": { description: Not admin } } }
  /scans/{id}: { get: { summary: One scan (viewer), parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { "200": { description: OK } } } }
  /score: { get: { summary: Security score (viewer), responses: { "200": { description: OK } } } }
